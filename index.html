<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nexus Chat</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.5/dist/mqtt.min.js"></script>
<script>if(typeof mqtt==='undefined'){document.write('<scr'+'ipt src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"><\/scr'+'ipt>');}</script>
<style>
:root{
  --bg:#070a12;
  --bg2:#0b1020;
  --panel:rgba(255,255,255,.045);
  --panel2:rgba(255,255,255,.07);
  --stroke:rgba(255,255,255,.09);
  --gold1:#f7e7a8;
  --gold2:#d4af37;
  --gold3:#a67c1a;
  --ice:#7fd8ff;
  --ice2:#3aa7d9;
  --text:#e9eef8;
  --muted:#8b98b0;
  --danger:#ff6b6b;
  --ok:#4ade80;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  overflow:hidden;
  overscroll-behavior:none;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 600px at 12% -10%, rgba(212,175,55,.16), transparent 60%),
    radial-gradient(800px 600px at 100% 0%, rgba(127,216,255,.13), transparent 55%),
    radial-gradient(700px 700px at 50% 120%, rgba(58,167,217,.10), transparent 60%),
    linear-gradient(180deg,#070a12,#0a0f1d 60%,#070a12);
}
#snow{position:fixed;inset:0;z-index:1;pointer-events:none}
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}

/* ============ AUTH ============ */
#authScreen{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  padding:22px;overflow-y:auto;
}
.auth-card{
  width:100%;max-width:420px;
  background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
  border:1px solid var(--stroke);
  border-radius:26px;padding:30px 24px 26px;
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.09);
  animation:rise .5s cubic-bezier(.2,.8,.2,1);
}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px}
.brand-logo{
  width:74px;height:74px;border-radius:22px;display:grid;place-items:center;font-size:36px;
  background:linear-gradient(145deg,#121a2e,#0a0f1d);
  border:1px solid rgba(212,175,55,.35);
  box-shadow:0 0 40px rgba(212,175,55,.25), inset 0 0 24px rgba(127,216,255,.12);
  animation:float 4s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.brand h1{
  margin:0;font-family:'Playfair Display',serif;font-size:30px;letter-spacing:.5px;
  background:linear-gradient(100deg,var(--gold1),var(--gold2) 40%,#fff5cf 55%,var(--gold3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:220% auto;animation:shine 5s linear infinite;
}
@keyframes shine{to{background-position:220% center}}
.brand p{margin:0;font-size:12.5px;color:var(--muted);letter-spacing:2.5px;text-transform:uppercase}
.tabs{display:flex;gap:6px;background:rgba(0,0,0,.28);border:1px solid var(--stroke);border-radius:14px;padding:5px;margin-bottom:18px}
.tabs button{
  flex:1;padding:11px;border:0;border-radius:10px;background:transparent;color:var(--muted);
  font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:.25s;
}
.tabs button.on{
  background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#1a1405;
  box-shadow:0 6px 20px rgba(212,175,55,.3);
}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin:0 0 6px 4px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700}
.field input{
  width:100%;padding:14px 15px;border-radius:14px;border:1px solid var(--stroke);
  background:rgba(0,0,0,.32);color:var(--text);font-family:inherit;font-size:15px;outline:none;transition:.25s;
}
.field input:focus{border-color:rgba(212,175,55,.55);box-shadow:0 0 0 4px rgba(212,175,55,.1)}
.field input::placeholder{color:#5c6880}
.btn-main{
  width:100%;padding:15px;border:0;border-radius:15px;cursor:pointer;
  font-family:inherit;font-weight:800;font-size:15.5px;letter-spacing:.4px;
  background:linear-gradient(135deg,var(--gold1),var(--gold2) 45%,var(--gold3));
  color:#1a1405;box-shadow:0 12px 30px rgba(212,175,55,.28);transition:.2s;
}
.btn-main:active{transform:scale(.975)}
.btn-main:disabled{opacity:.5}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6}
.err{color:var(--danger);font-size:13px;text-align:center;margin-top:10px;min-height:18px}

/* ============ APP ============ */
#appScreen{display:none;height:100%;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:11px;padding:12px 14px;
  background:rgba(9,13,24,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--stroke);flex-shrink:0;
  padding-top:calc(12px + env(safe-area-inset-top));
}
.icon-btn{
  width:42px;height:42px;flex-shrink:0;border-radius:13px;border:1px solid var(--stroke);
  background:var(--panel);color:var(--text);font-size:19px;cursor:pointer;
  display:grid;place-items:center;transition:.2s;
}
.icon-btn:active{transform:scale(.92);background:var(--panel2)}
.top-info{flex:1;min-width:0}
.top-info .t1{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-info .t2{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--danger);box-shadow:0 0 8px currentColor}
.dot.on{background:var(--ok)}

/* messages */
#msgs{
  flex:1;overflow-y:auto;padding:16px 13px 8px;display:flex;flex-direction:column;gap:11px;
  -webkit-overflow-scrolling:touch;
}
#msgs::-webkit-scrollbar{width:5px}
#msgs::-webkit-scrollbar-thumb{background:rgba(212,175,55,.3);border-radius:9px}
.empty{
  margin:auto;text-align:center;color:var(--muted);padding:30px 20px;
}
.empty .e-ic{font-size:52px;margin-bottom:12px;opacity:.85}
.empty h3{margin:0 0 6px;color:var(--text);font-size:17px}
.empty p{margin:0;font-size:13.5px;line-height:1.6}

.msg{display:flex;gap:9px;max-width:88%;animation:pop .28s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.av{
  width:36px;height:36px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;
  font-weight:800;font-size:15px;color:#0a0f1d;border:1px solid rgba(255,255,255,.14);
}
.bub{
  background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.03));
  border:1px solid var(--stroke);border-radius:16px;padding:9px 12px 7px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 6px 20px rgba(0,0,0,.25);min-width:0;word-break:break-word;
}
.msg.me .bub{
  background:linear-gradient(150deg,rgba(212,175,55,.22),rgba(212,175,55,.09));
  border-color:rgba(212,175,55,.35);
}
.m-name{font-size:12px;font-weight:800;margin-bottom:3px;color:var(--gold1)}
.msg.me .m-name{color:var(--gold1);text-align:right}
.m-text{font-size:14.7px;line-height:1.5;white-space:pre-wrap}
.m-text a{color:var(--ice);text-decoration:none}
.m-time{font-size:10.5px;color:var(--muted);margin-top:4px;text-align:right;letter-spacing:.3px}
.m-img{max-width:230px;border-radius:12px;display:block;cursor:pointer;margin:2px 0}
.m-file{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;
  background:rgba(0,0,0,.3);border:1px solid var(--stroke);text-decoration:none;color:var(--text);
  margin:2px 0;min-width:180px;
}
.m-file .fi{font-size:24px}
.m-file .fn{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.m-file .fs{font-size:11px;color:var(--muted)}
.m-audio{width:220px;max-width:100%;height:40px;margin:2px 0}
.sysmsg{align-self:center;font-size:11.5px;color:var(--muted);background:rgba(0,0,0,.3);
  padding:5px 12px;border-radius:20px;border:1px solid var(--stroke)}

/* typing */
#typing{height:18px;padding:0 18px;font-size:12px;color:var(--ice);flex-shrink:0;font-style:italic}

/* composer */
.composer{
  flex-shrink:0;padding:9px 11px calc(9px + env(safe-area-inset-bottom));
  background:rgba(9,13,24,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--stroke);
}
.comp-row{display:flex;align-items:flex-end;gap:8px}
.comp-row textarea{
  flex:1;resize:none;max-height:110px;min-height:46px;padding:13px 14px;border-radius:15px;
  border:1px solid var(--stroke);background:rgba(0,0,0,.34);color:var(--text);
  font-family:inherit;font-size:15px;outline:none;line-height:1.4;
}
.comp-row textarea:focus{border-color:rgba(212,175,55,.45)}
.cbtn{
  width:46px;height:46px;flex-shrink:0;border-radius:15px;border:1px solid var(--stroke);
  background:var(--panel);color:var(--text);font-size:20px;cursor:pointer;display:grid;place-items:center;transition:.2s;
}
.cbtn:active{transform:scale(.9)}
.cbtn.send{
  background:linear-gradient(135deg,var(--gold1),var(--gold2) 50%,var(--gold3));
  color:#1a1405;border:0;box-shadow:0 8px 22px rgba(212,175,55,.3);
}
.cbtn.rec{background:linear-gradient(135deg,#ff8a8a,#e03131);color:#fff;border:0;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,49,49,.5)}50%{box-shadow:0 0 0 12px rgba(224,49,49,0)}}

/* drawer */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;opacity:0;pointer-events:none;transition:.3s}
#overlay.on{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;top:0;left:0;bottom:0;width:290px;max-width:84vw;z-index:80;
  background:linear-gradient(170deg,#0d1424,#080c17);
  border-right:1px solid var(--stroke);transform:translateX(-102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);
}
#drawer.on{transform:none}
.dr-head{padding:18px 18px 14px;border-bottom:1px solid var(--stroke)}
.dr-user{display:flex;align-items:center;gap:11px}
.dr-user .av{width:46px;height:46px;border-radius:15px;font-size:19px}
.dr-user .un{font-weight:800;font-size:16px}
.dr-user .us{font-size:11.5px;color:var(--muted)}
.dr-sec{padding:14px 16px 6px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:800}
#chanList{flex:1;overflow-y:auto;padding:0 10px 10px}
.chan{
  display:flex;align-items:center;gap:11px;padding:12px 12px;border-radius:14px;cursor:pointer;
  margin-bottom:5px;transition:.2s;border:1px solid transparent;
}
.chan:active{background:var(--panel)}
.chan.on{background:linear-gradient(135deg,rgba(212,175,55,.18),rgba(212,175,55,.06));border-color:rgba(212,175,55,.32)}
.chan .ci{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;
  background:rgba(0,0,0,.35);border:1px solid var(--stroke);flex-shrink:0}
.chan .cn{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan .cd{font-size:11px;color:var(--muted)}
.dr-foot{padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--stroke);display:flex;gap:9px}
.dr-foot button{
  flex:1;padding:12px;border-radius:13px;border:1px solid var(--stroke);background:var(--panel);
  color:var(--text);font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;
}
.dr-foot button.gold{background:linear-gradient(135deg,var(--gold1),var(--gold2) 50%,var(--gold3));color:#1a1405;border:0}

/* modal */
.modal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .sheet{
  width:100%;max-width:520px;background:linear-gradient(170deg,#101728,#0a0f1c);
  border:1px solid var(--stroke);border-bottom:0;border-radius:24px 24px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  animation:up .3s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow-y:auto;
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{margin:0 0 4px;font-size:19px;font-family:'Playfair Display',serif;
  background:linear-gradient(100deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sheet .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.grab{width:44px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:0 auto 14px}

/* emoji */
.emoji-cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid var(--stroke)}
.emoji-cats button{
  flex-shrink:0;padding:7px 12px;border-radius:11px;border:1px solid var(--stroke);background:var(--panel);
  color:var(--muted);font-size:18px;cursor:pointer;transition:.2s;
}
.emoji-cats button.on{background:linear-gradient(135deg,var(--gold2),var(--gold3));border-color:transparent}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emoji-grid span{font-size:25px;text-align:center;padding:5px 0;border-radius:10px;cursor:pointer;transition:.15s}
.emoji-grid span:active{background:var(--panel2);transform:scale(1.25)}

/* image viewer */
#viewer{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:14px}
#viewer.on{display:flex}
#viewer img{max-width:100%;max-height:100%;border-radius:12px}
#viewer .close{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.12);border:1px solid var(--stroke);color:#fff;font-size:22px;display:grid;place-items:center;cursor:pointer}

/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:rgba(20,26,42,.96);border:1px solid rgba(212,175,55,.4);color:var(--text);
  padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:99;
  opacity:0;pointer-events:none;transition:.3s;max-width:88vw;text-align:center;
  box-shadow:0 14px 40px rgba(0,0,0,.6);
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* rec bar */
#recBar{
  display:none;align-items:center;gap:11px;padding:11px 14px;border-radius:15px;
  background:rgba(224,49,49,.14);border:1px solid rgba(224,49,49,.4);margin-bottom:9px;
}
#recBar.on{display:flex}
#recBar .rdot{width:11px;height:11px;border-radius:50%;background:#ff4d4d;animation:pulse 1s infinite}
#recBar .rt{flex:1;font-size:13.5px;font-weight:700;color:#ffb3b3}
#recBar button{padding:8px 14px;border-radius:11px;border:0;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer}
#recBar .stop{background:#e03131;color:#fff}
#recBar .cancel{background:rgba(255,255,255,.12);color:var(--text)}

/* onboarding */
#tour{position:fixed;inset:0;z-index:100;background:rgba(4,7,14,.9);backdrop-filter:blur(14px);
  display:none;align-items:center;justify-content:center;padding:20px}
#tour.on{display:flex}
.tour-card{
  width:100%;max-width:400px;background:linear-gradient(165deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  border:1px solid var(--stroke);border-radius:26px;padding:30px 24px 24px;text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.7);position:relative;
}
.tour-skip{position:absolute;top:14px;right:14px;background:transparent;border:0;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;font-weight:700}
.tour-ic{font-size:60px;margin-bottom:14px;animation:float 3.5s ease-in-out infinite}
.tour-card h2{margin:0 0 10px;font-family:'Playfair Display',serif;font-size:23px;
  background:linear-gradient(100deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tour-card p{margin:0;font-size:14px;color:#b9c4d6;line-height:1.65;min-height:66px}
.tour-dots{display:flex;gap:7px;justify-content:center;margin:20px 0 18px}
.tour-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:.3s;cursor:pointer}
.tour-dots i.on{width:24px;border-radius:5px;background:linear-gradient(90deg,var(--gold1),var(--gold2))}
.tour-btns{display:flex;gap:10px}
.tour-btns button{flex:1;padding:13px;border-radius:14px;border:1px solid var(--stroke);background:var(--panel);
  color:var(--text);font-family:inherit;font-weight:800;font-size:14px;cursor:pointer}
.tour-btns button.gold{background:linear-gradient(135deg,var(--gold1),var(--gold2) 50%,var(--gold3));color:#1a1405;border:0}
</style>
</head>
<body>
<canvas id="snow"></canvas>

<!-- ============ AUTH ============ -->
<div id="authScreen">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo">💬</div>
      <h1>Nexus Chat</h1>
      <p>Premium Messenger</p>
    </div>
    <div class="tabs">
      <button id="tabLogin" class="on" onclick="switchTab('login')">Вход</button>
      <button id="tabReg" onclick="switchTab('reg')">Регистрация</button>
    </div>
    <div class="field">
      <label>Никнейм</label>
      <input id="inNick" maxlength="18" placeholder="Например: Архитектор" autocomplete="username">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input id="inPass" type="password" maxlength="30" placeholder="••••••" autocomplete="current-password">
    </div>
    <button class="btn-main" id="authBtn" onclick="doAuth()">Войти</button>
    <div class="err" id="authErr"></div>
    <div class="hint">Ник виден другим участникам.<br>Пароль хранится только на этом устройстве.</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appScreen" class="wrap">
  <div class="topbar">
    <button class="icon-btn" onclick="openDrawer()">☰</button>
    <div class="top-info">
      <div class="t1" id="topName">Каналы</div>
      <div class="t2"><span class="dot" id="netDot"></span><span id="netTxt">подключение…</span><span id="lockTxt" style="color:var(--ok);font-weight:700">🔒 E2E</span></div>
    </div>
    <button class="icon-btn" onclick="openCreate()">＋</button>
  </div>

  <div id="msgs"></div>
  <div id="typing"></div>

  <div class="composer">
    <div id="recBar">
      <span class="rdot"></span>
      <span class="rt" id="recTime">Запись… 0:00</span>
      <button class="cancel" onclick="cancelRec()">Отмена</button>
      <button class="stop" onclick="stopRec()">Отправить</button>
    </div>
    <div class="comp-row">
      <button class="cbtn" onclick="openEmoji()">😊</button>
      <button class="cbtn" onclick="pickFile('image/*')">🖼️</button>
      <button class="cbtn" onclick="pickFile('*/*')">📎</button>
      <textarea id="inMsg" rows="1" placeholder="Сообщение…" oninput="autoGrow(this)" onkeydown="onKey(event)"></textarea>
      <button class="cbtn" id="micBtn" onclick="toggleRec()">🎤</button>
      <button class="cbtn send" onclick="sendText()">➤</button>
    </div>
  </div>
</div>

<input type="file" id="fileIn" style="display:none">

<!-- drawer -->
<div id="overlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <div class="dr-head">
    <div class="dr-user">

<script>
/* ================= CONFIG ================= */
const BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://test.mosquitto.org:8081/mqtt'
];
const BASE = 'nexuschat_v1_';
const T_DIR = BASE + 'directory';
const tHist = c => BASE + 'hist_' + c;
const tMsg  = c => BASE + 'msg_'  + c;
const tType = c => BASE + 'typ_'  + c;

/* ================= STATE ================= */
let clients = [];
let me = null;
let channels = [];
let cur = null;
let store = {};      // channelId -> [messages]
let seen = {};       // channelId -> Set(ids)
let typingTimers = {};
let typingSentAt = 0;
let rec = null, recChunks = [], recTimer = null, recSec = 0;

/* ================= UTILS ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtSize = b => b < 1024 ? b + ' Б' : b < 1048576 ? (b/1024).toFixed(1) + ' КБ' : (b/1048576).toFixed(2) + ' МБ';
const fmtTime = t => new Date(t).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
function hueOf(s){ let h = 0; for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % 360; return h; }
function colorOf(s){ return `hsl(${hueOf(s)},72%,62%)`; }
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 2400); }

/* ================= SNOW ================= */
(function snow(){
  const c = $('snow'), x = c.getContext('2d');
  let w, h, flakes = [];
  function resize(){ w = c.width = innerWidth; h = c.height = innerHeight; }
  resize(); addEventListener('resize', resize);
  for (let i=0;i<70;i++) flakes.push({x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:Math.random()*2.2+.6, s:Math.random()*.7+.25, d:Math.random()*Math.PI*2, o:Math.random()*.5+.25});
  (function loop(){
    x.clearRect(0,0,w,h);
    flakes.forEach(f=>{
      f.y += f.s; f.d += .012; f.x += Math.sin(f.d)*.5;
      if (f.y > h+6){ f.y = -6; f.x = Math.random()*w; }
      x.beginPath(); x.arc(f.x, f.y, f.r, 0, 7);
      x.fillStyle = `rgba(190,230,255,${f.o})`; x.fill();
    });
    requestAnimationFrame(loop);
  })();
})();

/* ================= E2E ENCRYPTION (AES-256-GCM) ================= */
const E2E = !!(window.crypto && window.crypto.subtle);
const keyCache = new Map();

function b64(u8){
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(s);
}
function unb64(str){ return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }
function randSecret(){
  const a = crypto.getRandomValues(new Uint8Array(24));
  return b64(a).replace(/[^A-Za-z0-9]/g, '').slice(0, 32);
}
function secretOf(chId){
  const c = channels.find(x => x.id === chId);
  return (c && c.sec) ? c.sec : ('nx-default-' + chId);
}
async function getKey(secret){
  if (keyCache.has(secret)) return keyCache.get(secret);
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode('nexus-e2e-salt-v1'), iterations: 120000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  keyCache.set(secret, key);
  return key;
}
async function encryptObj(secret, obj){
  const key = await getKey(secret);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv: b64(iv), d: b64(new Uint8Array(ct)) };
}
async function decryptObj(secret, p){
  const key = await getKey(secret);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(p.iv) }, key, unb64(p.d));
  return JSON.parse(new TextDecoder().decode(pt));
}
/* упаковка: id и время открыты (для сортировки/дублей), весь контент — шифр */
async function packMsg(chId, m){
  if (!E2E) return m;
  const { id, time, ...secret } = m;
  const enc = await encryptObj(secretOf(chId), secret);
  return { id, time, e: 1, iv: enc.iv, d: enc.d };
}
async function unpackMsg(chId, p){
  if (!p || p.e !== 1) return p;
  for (let attempt = 0; attempt < 3; attempt++){
    try {
      const sec = await decryptObj(secretOf(chId), p);
      return Object.assign({ id: p.id, time: p.time }, sec);
    } catch(e){
      // ключ канала мог ещё не прийти из справочника — подождём и попробуем снова
      const known = channels.find(x => x.id === chId);
      if (known && known.sec) break;
      await new Promise(r => setTimeout(r, 700));
    }
  }
  return { id: p.id || uid(), time: p.time || Date.now(), type: 'sys', text: '🔒 Сообщение зашифровано другим ключом' };
}

/* ================= AUTH ================= */
let authMode = 'login';
function switchTab(m){
  authMode = m;
  $('tabLogin').classList.toggle('on', m==='login');
  $('tabReg').classList.toggle('on', m==='reg');
  $('authBtn').textContent = m==='login' ? 'Войти' : 'Создать аккаунт';
  $('authErr').textContent = '';
}
function users(){ try { return JSON.parse(localStorage.getItem('nx_users') || '{}'); } catch(e){ return {}; } }
function saveUsers(u){ localStorage.setItem('nx_users', JSON.stringify(u)); }

function doAuth(){
  const nick = $('inNick').value.trim();
  const pass = $('inPass').value;
  const err = $('authErr');
  err.textContent = '';
  if (nick.length < 2){ err.textContent = 'Ник — минимум 2 символа'; return; }
  if (!/^[A-Za-zА-Яа-яЁё0-9_ .-]+$/.test(nick)){ err.textContent = 'Ник: буквы, цифры, _ . -'; return; }
  if (pass.length < 3){ err.textContent = 'Пароль — минимум 3 символа'; return; }
  const u = users();
  const key = nick.toLowerCase();
  if (authMode === 'reg'){
    if (u[key]){ err.textContent = 'Такой ник уже занят'; return; }
    u[key] = { nick, pass: btoa(pass), id: uid(), color: colorOf(nick) };
    saveUsers(u);
    toast('Аккаунт создан!');
  } else {
    if (!u[key]){ err.textContent = 'Ник не найден — зарегистрируйся'; return; }
    if (u[key].pass !== btoa(pass)){ err.textContent = 'Неверный пароль'; return; }
  }
  const acc = u[key];
  me = { nick: acc.nick, id: acc.id, color: acc.color || colorOf(acc.nick) };
  localStorage.setItem('nx_me', JSON.stringify(me));
  enterApp();
}
function logout(){
  closeDrawer();
  clients.forEach(c => { try { c.end(true); } catch(e){} });
  clients = [];
  localStorage.removeItem('nx_me');
  me = null; cur = null; channels = []; store = {}; seen = {};
  $('appScreen').style.display = 'none';
  $('authScreen').style.display = 'flex';
  $('inPass').value = '';
}

/* ================= APP INIT ================= */
function enterApp(){
  $('authScreen').style.display = 'none';
  $('appScreen').style.display = 'flex';
  $('drAv').textContent = me.nick[0].toUpperCase();
  $('drAv').style.background = me.color;
  $('drName').textContent = me.nick;
  loadLocalChannels();
  connectMQTT();
  if (!localStorage.getItem('nx_tour')) setTimeout(startTour, 700);
}

/* ================= MQTT (мульти-брокер: связь идёт через ВСЕ узлы сразу) ================= */
function setNet(on, txt){
  $('netDot').classList.toggle('on', on);
  $('netTxt').textContent = txt;
}
function updateNet(){
  const live = clients.filter(c => c.connected).length;
  if (live > 0) setNet(true, 'в сети · ' + live + '/' + BROKERS.length);
  else setNet(false, 'подключение…');
}
function connectMQTT(){
  clients.forEach(c => { try { c.end(true); } catch(e){} });
  clients = [];
  if (typeof mqtt === 'undefined'){ setNet(false, 'нет библиотеки связи'); return; }
  BROKERS.forEach((url, i) => setTimeout(() => connectBroker(url), i * 250));
  setTimeout(updateNet, 2500);
}
function connectBroker(url){
  let c;
  try {
    c = mqtt.connect(url, {
      clientId: 'nx_' + me.id + '_' + Math.random().toString(16).slice(2, 8),
      clean: true, reconnectPeriod: 5000, connectTimeout: 12000, keepalive: 30
    });
  } catch(e){ return; }
  clients.push(c);
  c.on('connect', () => {
    updateNet();
    c.subscribe(T_DIR);
    if (cur){ c.subscribe(tHist(cur)); c.subscribe(tMsg(cur)); c.subscribe(tType(cur)); }
  });
  c.on('reconnect', updateNet);
  c.on('close', updateNet);
  c.on('error', updateNet);
  c.on('message', onMQTT);
}
/* публикуем во все узлы — сообщение дойдёт, даже если устройства сидят на разных брокерах */
function pub(topic, payload, opts){
  let sent = 0;
  clients.forEach(c => { if (c.connected){ try { c.publish(topic, payload, opts || {}); sent++; } catch(e){} } });
  return sent;
}

async function onMQTT(topic, payload){
  let d; try { d = JSON.parse(payload.toString()); } catch(e){ return; }

  if (topic === T_DIR){
    if (Array.isArray(d) && d.length){
      /* объединяем справочник: свои каналы не теряем, чужие добавляем вместе с ключом */
      const map = new Map(channels.map(c => [c.id, c]));
      d.forEach(c => { if (c && c.id) map.set(c.id, Object.assign({}, map.get(c.id) || {}, c)); });
      channels = Array.from(map.values());
      saveChannels();
      renderChannels();
    }
    return;
  }
  const chId = topic.replace(BASE, '').replace(/^(hist_|msg_|typ_)/, '');
  if (!store[chId]){ store[chId] = []; seen[chId] = new Set(); }

  if (topic.startsWith(BASE + 'hist_')){
    if (Array.isArray(d)){
      for (const env of d){
        const m = await unpackMsg(chId, env);
        if (m) addMsg(chId, m, false);
      }
      if (chId === cur) renderMsgs();
    }
    return;
  }
  if (topic.startsWith(BASE + 'msg_')){
    const m = await unpackMsg(chId, d);
    if (m) addMsg(chId, m, true);
    return;
  }
  if (topic.startsWith(BASE + 'typ_')){
    const t = await unpackMsg(chId, d);
    if (!t || t.id === me.id || chId !== cur) return;
    showTyping(t.nick);
  }
}

function subscribeChannel(id){
  clients.forEach(c => {
    if (!c.connected) return;
    try { c.subscribe(tHist(id)); c.subscribe(tMsg(id)); c.subscribe(tType(id)); } catch(e){}
  });
}

function addMsg(chId, m, live){
  if (!store[chId]){ store[chId] = []; seen[chId] = new Set(); }
  if (seen[chId].has(m.id)) return;
  seen[chId].add(m.id);
  store[chId].push(m);
  if (store[chId].length > 120) store[chId] = store[chId].slice(-120);
  if (live && chId === cur) renderMsgs();
  if (live && chId !== cur) toast('💬 ' + (m.nick || 'Кто-то') + ': ' + (m.type === 'text' ? m.text.slice(0,40) : 'вложение'));
}

/* ================= CHANNELS ================= */
function loadLocalChannels(){
  try { channels = JSON.parse(localStorage.getItem('nx_chans') || '[]'); } catch(e){ channels = []; }
  if (!channels.length){
    channels = [
      { id: 'general', name: 'Общий', ic: '💬' },
      { id: 'montazh', name: 'Монтажники', ic: '🛠️' }
    ];
    localStorage.setItem('nx_chans', JSON.stringify(channels));
  }
  renderChannels();
  const last = localStorage.getItem('nx_last');
  joinChannel(channels.find(c=>c.id===last) ? last : channels[0].id);
}
function saveChannels(){ localStorage.setItem('nx_chans', JSON.stringify(channels)); }

function renderChannels(){
  const box = $('chanList');
  box.innerHTML = channels.map(c => `
    <div class="chan ${c.id===cur?'on':''}" onclick="joinChannel('${c.id}')">
      <div class="ci">${esc(c.ic || '💬')}</div>
      <div style="min-width:0">
        <div class="cn">${esc(c.name)}</div>
        <div class="cd">${(store[c.id]||[]).length} сообщ.</div>
      </div>
    </div>`).join('');
}

function joinChannel(id){
  if (cur === id){ closeDrawer(); return; }
  cur = id;
  localStorage.setItem('nx_last', id);
  const c = channels.find(x => x.id === id);
  $('topName').textContent = c ? (c.ic + ' ' + c.name) : 'Канал';
  if (!store[id]){ store[id] = []; seen[id] = new Set(); }
  subscribeChannel(id);
  renderMsgs();
  renderChannels();
  closeDrawer();
}

function openCreate(){ closeDrawer(); $('createModal').classList.add('on'); $('inChan').value=''; $('inChanIc').value='💬'; setTimeout(()=>$('inChan').focus(), 250); }
function closeCreate(){ $('createModal').classList.remove('on'); }
function createChannel(){
  const name = $('inChan').value.trim();
  const ic = ($('inChanIc').value.trim() || '💬').slice(0,2);
  if (name.length < 2){ toast('Название — минимум 2 символа'); return; }
  const id = 'c' + uid();
  const ch = { id, name, ic, by: me.nick, sec: randSecret() };
  channels.push(ch);
  saveChannels();
  pub(T_DIR, JSON.stringify(channels), { retain: true });
  closeCreate();
  joinChannel(id);
  toast('Канал создан ✨');
}

/* ================= MESSAGES ================= */
function renderMsgs(){
  const box = $('msgs');
  const list = store[cur] || [];
  if (!list.length){
    const c = channels.find(x => x.id === cur);
    box.innerHTML = `<div class="empty">
      <div class="e-ic">${c ? esc(c.ic||'💬') : '💬'}</div>
      <h3>${c ? esc(c.name) : 'Канал'}</h3>
      <p>Пока пусто. Напиши первое сообщение —<br>его увидят все участники канала.</p>
    </div>`;
    return;
  }
  box.innerHTML = list.map(m => renderMsg(m)).join('');
  box.scrollTop = box.scrollHeight;
}

function renderMsg(m){
  if (m.type === 'sys') return `<div class="sysmsg">${esc(m.text)}</div>`;
  const mine = m.id_user === me.id;
  const av = `<div class="av" style="background:${m.color || colorOf(m.nick||'?')}">${esc((m.nick||'?')[0].toUpperCase())}</div>`;
  let body = '';
  if (m.type === 'text'){
    body = `<div class="m-text">${linkify(esc(m.text))}</div>`;
  } else if (m.type === 'image'){
    body = `<img class="m-img" src="${m.data}" onclick="viewImg('${m.id}')" alt="фото">`;
  } else if (m.type === 'file'){
    body = `<a class="m-file" href="${m.data}" download="${esc(m.name)}">
      <span class="fi">📄</span>
      <span style="min-width:0"><span class="fn">${esc(m.name)}</span><br><span class="fs">${fmtSize(m.size||0)} · скачать</span></span>
    </a>`;
  } else if (m.type === 'audio'){
    body = `<audio class="m-audio" controls src="${m.data}"></audio>`;
  }
  return `<div class="msg ${mine?'me':''}">
    ${av}
    <div class="bub">
      ${mine ? '' : `<div class="m-name">${esc(m.nick)}</div>`}
      ${body}
      <div class="m-time">${fmtTime(m.time)}</div>
    </div>
  </div>`;
}
function linkify(s){ return s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function viewImg(id){
  for (const ch in store){ const m = store[ch].find(x => x.id === id); if (m){ $('viewerImg').src = m.data; $('viewer').classList.add('on'); return; } }
}
function closeViewer(){ $('viewer').classList.remove('on'); $('viewerImg').src=''; }

/* ================= SEND ================= */
function autoGrow(el){ el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 110) + 'px'; }
function onKey(e){ if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendText(); } }

async function pushMsg(obj){
  const ch = cur;
  const m = Object.assign({ id: uid(), id_user: me.id, nick: me.nick, color: me.color, time: Date.now() }, obj);
  addMsg(ch, m, true);
  try {
    const env = await packMsg(ch, m);
    const sent = pub(tMsg(ch), JSON.stringify(env));
    if (!sent) toast('Нет связи — сообщение пока только у тебя');
    /* история для новых участников: тяжёлые вложения не кладём, иначе брокер рвёт соединение */
    const hist = (store[ch] || []).slice(-40).map(x => {
      if (x.data && x.data.length > 50000) return Object.assign({}, x, { data: '', trimmed: 1 });
      return x;
    });
    const envHist = await Promise.all(hist.map(x => packMsg(ch, x)));
    pub(tHist(ch), JSON.stringify(envHist), { retain: true });
  } catch(e){ toast('Ошибка шифрования — сообщение не отправлено'); }
  return m;
}

function sendText(){
  const el = $('inMsg');
  const txt = el.value.trim();
  if (!txt) return;
  if (!cur){ toast('Сначала выбери канал'); return; }
  pushMsg({ type: 'text', text: txt });
  el.value = ''; autoGrow(el);
}

async function sendTyping(){
  const now = Date.now();
  if (now - typingSentAt < 1800) return;
  typingSentAt = now;
  if (!cur) return;
  try {
    const env = E2E ? Object.assign({ e: 1 }, await encryptObj(secretOf(cur), { id: me.id, nick: me.nick })) : { id: me.id, nick: me.nick };
    pub(tType(cur), JSON.stringify(env));
  } catch(e){}
}
function showTyping(nick){
  $('typing').textContent = nick + ' печатает…';
  clearTimeout(typingTimers[nick]);
  typingTimers[nick] = setTimeout(()=>{ $('typing').textContent = ''; }, 2200);
}

/* ================= FILES ================= */
let fileMode = '*/*';
function pickFile(accept){ fileMode = accept; const f = $('fileIn'); f.accept = accept; f.value = ''; f.click(); }
$('fileIn').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  if (f.size > 900 * 1024){ toast('Файл больше 900 КБ — выбери меньше'); return; }
  toast('Обработка…');
  try {
    if (f.type.startsWith('image/')){
      const data = await compressImg(f);
      pushMsg({ type: 'image', data, name: f.name });
    } else {
      const data = await readAsDataURL(f);
      pushMsg({ type: 'file', data, name: f.name, size: f.size });
    }
  } catch(err){ toast('Не удалось отправить файл'); }
});
function readAsDataURL(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); }); }
function compressImg(f){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 900;
        let w = img.width, h = img.height;
        if (w > max || h > max){ const k = Math.min(max/w, max/h); w = Math.round(w*k); h = Math.round(h*k); }
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(f);
  });
}

/* ================= VOICE ================= */
async function toggleRec(){
  if (rec) { stopRec(); return; }
  if (!cur){ toast('Сначала выбери канал'); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder){ toast('Микрофон не поддерживается'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recChunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const wasCancel = rec._cancel;
      rec = null;
      clearInterval(recTimer);
      $('recBar').classList.remove('on');
      $('micBtn').classList.remove('rec');
      $('micBtn').textContent = '🎤';
      if (wasCancel || !recChunks.length) return;
      const blob = new Blob(recChunks, { type: 'audio/webm' });
      if (blob.size > 900 * 1024){ toast('Голосовое слишком длинное'); return; }
      const r = new FileReader();
      r.onload = () => pushMsg({ type: 'audio', data: r.result, size: blob.size });
      r.readAsDataURL(blob);
    };
    rec.start();
    recSec = 0;
    $('recBar').classList.add('on');
    $('micBtn').classList.add('rec');
    $('micBtn').textContent = '⏹';
    $('recTime').textContent = 'Запись… 0:00';
    recTimer = setInterval(() => {
      recSec++;
      $('recTime').textContent = 'Запись… ' + Math.floor(recSec/60) + ':' + String(recSec%60).padStart(2,'0');
      if (recSec >= 60) stopRec();
    }, 1000);
  } catch(e){ toast('Нет доступа к микрофону'); }
}
function stopRec(){ if (rec){ rec._cancel = false; rec.stop(); } }
function cancelRec(){ if (rec){ rec._cancel = true; rec.stop(); } }
